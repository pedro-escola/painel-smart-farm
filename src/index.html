<!DOCTYPE html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8">
		<meta http-equiv="X-UA-Compatible" content="IE=edge">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Smart Farm</title>

		<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation"></script>
		<script src="assets/js/main.js"></script>
		
		<link rel="stylesheet" href="assets/css/normalize.css">
		<link rel="stylesheet" href="assets/css/styles.css">
	</head>
	<body>
		<main>
			<header class="window lado-a-lado">
				<nav class="window navCoisa">
					<input type="checkbox" name="fakeData" id="fakeDataBox">
					<label for="fakeDataBox">Utilizar dados falsos?</label>
				</nav>

				<div class="disableParagraphMargin" style="display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 0; padding-top: .5rem;">
					<h3 id="statusConexao" class="offlineText">Você está offline.</h3>
					<img id="conexaoImg" src="assets/img/no-wifi.png" width="64" alt="Ícone de Offline">
				</div>
				<div class="disableParagraphMargin lado-a-lado2">
					<img src="assets/img/temperature.png" alt="Ícone de Temperatura" width="64">
					
					<div class="offlineText">
						<h3>Temperatura</h3>
						<div class="headerThing">
							<h4 id="temperaturaTexto">--</h4><p>°C</p>
						</div>
					</div>
				</div>
				<div class="disableParagraphMargin lado-a-lado2">
					<img src="assets/img/humidity.png" alt="Ícone de Umidade" width="64">

					<div class="blueText">
						<h3>Umidade</h3>
						<div class="headerThing">
							<h4 id="umidadeTexto">--</h4><p>%</p>
						</div>
					</div>
				</div>
				<div class="disableParagraphMargin lado-a-lado2">
					<img src="assets/img/pump.png" alt="Ícone da Bomba d'água" width="64">

					<div>
						<h3 class="blueText">Bomba</h3>
						<div class="headerThing">
							<h4 id="estadoBomba">--</h4>
						</div>
					</div>
				</div>
			</header>

			<div class="lado-a-lado">
				<div id="bob">
					<div class="window" id="alertaRecente">
						<h2>Último Alerta</h2>
						<p id="alertaAtual">--</p>
					</div>

					<div class="window" id="grafico">
						<h2>Leituras Recentes</h2>
						<div style="display: relative; flex: 1;"><canvas id="graficoCanvas"></canvas></div>
					</div>
				</div>

				<div class="window" id="janelaLogs">
					<h2>Histórico</h2>
					
					<div id="logs"></div>
					<p>Ver mais</p>
				</div>
			</div>
		</main>
	</body>
</html>
